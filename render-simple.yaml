services:
  # Backend API Service - Simplified for Render
  - type: web
    name: trackx-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trackx-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: USE_SQLITE
        value: false
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
    healthCheck:
      http:
        path: /api/v1/health/
        initialDelaySeconds: 90
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 5

  # Frontend Service
  - type: web
    name: trackx-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: trackx-backend
          property: url
    healthCheck:
      http:
        path: /
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 5

databases:
  - name: trackx-postgres
    databaseName: trackx
    user: trackx
    plan: free
