services:
  # Backend API Service - Simplified for Render
  - type: web
    name: trackx-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trackx-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: USE_SQLITE
        value: false
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: DEBUG
        value: "False"
    healthCheck:
      http:
        path: /api/v1/health/
        initialDelaySeconds: 180
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 10

databases:
  - name: trackx-postgres
    databaseName: trackx
    user: trackx
    plan: free
