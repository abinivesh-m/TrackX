<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Card gradients -->
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="cardAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L12,4 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L12,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="820" fill="url(#grid)"/>
  </g>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="78" fill="#0a0f1e" opacity="0.6"/>
  <text x="600" y="40" text-anchor="middle" font-size="30" font-weight="800" fill="url(#titleGrad)">TrackX</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#94a3b8" font-weight="500">City-Wide AI Engine for Multi-Camera ANPR Trajectory Tracking &amp; Urban Traffic Analytics</text>
  <text x="600" y="78" text-anchor="middle" font-size="10" fill="#64748b">SIH 2026 · Problem Statement SIH26127 · Bharat Electronics Limited (BEL) · Team NexussAI</text>

  <!-- ===== LAYER 1: INPUT ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="95" width="1120" height="95" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  </g>
  <rect x="40" y="95" width="6" height="95" rx="3" fill="#3b82f6"/>
  <text x="62" y="118" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="2">LAYER 1  ·  INPUT</text>
  <text x="62" y="133" font-size="10" fill="#64748b">Real-time &amp; recorded camera feeds</text>

  <!-- Input cards -->
  <g filter="url(#shadow)">
    <rect x="180" y="118" width="250" height="52" rx="10" fill="url(#cardBlue)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="305" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">📹 City CCTV / ANPR Cameras</text>
  <text x="305" y="158" text-anchor="middle" font-size="10" fill="#93c5fd">RTSPS live streams (7 cameras)</text>

  <g filter="url(#shadow)">
    <rect x="470" y="118" width="220" height="52" rx="10" fill="url(#cardBlue)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="580" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">🎬 Recorded Video Files</text>
  <text x="580" y="158" text-anchor="middle" font-size="10" fill="#93c5fd">MP4 / AVI footage</text>

  <g filter="url(#shadow)">
    <rect x="730" y="118" width="300" height="52" rx="10" fill="url(#cardBlue)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="880" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">⚙️ Stream Manager</text>
  <text x="880" y="158" text-anchor="middle" font-size="10" fill="#93c5fd">FFmpeg bridge · frame extraction</text>

  <!-- Arrow L1→L2 -->
  <line x1="600" y1="190" x2="600" y2="215" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glow)"/>

  <!-- ===== LAYER 2: AI PIPELINE ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="1120" height="120" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  </g>
  <rect x="40" y="220" width="6" height="120" rx="3" fill="#8b5cf6"/>
  <text x="62" y="242" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2">LAYER 2  ·  AI PIPELINE (per frame)</text>
  <text x="62" y="257" font-size="10" fill="#64748b">Detection → Plate detection → OCR → Appearance embedding</text>

  <g filter="url(#shadow)">
    <rect x="70" y="270" width="220" height="52" rx="10" fill="url(#cardPurple)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="180" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">YOLOv8 + ByteTrack</text>
  <text x="180" y="310" text-anchor="middle" font-size="10" fill="#c4b5fd">Vehicle Detection &amp; Tracking</text>

  <line x1="290" y1="296" x2="320" y2="296" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="320" y="270" width="190" height="52" rx="10" fill="url(#cardPurple)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="415" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Plate Detector</text>
  <text x="415" y="310" text-anchor="middle" font-size="10" fill="#c4b5fd">YOLO (fine-tuned) / ONNX</text>

  <line x1="510" y1="296" x2="540" y2="296" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="540" y="270" width="260" height="52" rx="10" fill="url(#cardPurple)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="670" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">PaddleOCR + Temporal Fusion</text>
  <text x="670" y="310" text-anchor="middle" font-size="10" fill="#c4b5fd">vote_plate_text() · confusable-char correction</text>

  <line x1="800" y1="296" x2="830" y2="296" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="830" y="270" width="250" height="52" rx="10" fill="url(#cardPurple)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="955" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">ResNet-18 Appearance</text>
  <text x="955" y="310" text-anchor="middle" font-size="10" fill="#c4b5fd">Vehicle Re-ID embedding (512-dim)</text>

  <!-- Arrow L2→L3 -->
  <line x1="600" y1="340" x2="600" y2="365" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glow)"/>

  <!-- ===== LAYER 3: INTELLIGENCE ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="370" width="1120" height="120" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  </g>
  <rect x="40" y="370" width="6" height="120" rx="3" fill="#22c55e"/>
  <text x="62" y="392" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="2">LAYER 3  ·  INTELLIGENCE (multi-camera reasoning)</text>
  <text x="62" y="407" font-size="10" fill="#64748b">Identity fusion · trajectory reconstruction · analytics · alerts</text>

  <g filter="url(#shadow)">
    <rect x="70" y="420" width="240" height="52" rx="10" fill="url(#cardGreen)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="190" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Identity Fusion</text>
  <text x="190" y="460" text-anchor="middle" font-size="10" fill="#86efac">plate 45% + appearance 25%</text>
  <text x="190" y="473" text-anchor="middle" font-size="10" fill="#86efac">time 15% + space 15%</text>

  <line x1="310" y1="446" x2="340" y2="446" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="340" y="420" width="250" height="52" rx="10" fill="url(#cardGreen)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="465" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Trajectory Reconstruction</text>
  <text x="465" y="460" text-anchor="middle" font-size="10" fill="#86efac">Coimbatore road graph</text>
  <text x="465" y="473" text-anchor="middle" font-size="10" fill="#86efac">travel-time plausibility</text>

  <line x1="590" y1="446" x2="620" y2="446" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="620" y="420" width="240" height="52" rx="10" fill="url(#cardGreen)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="740" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Traffic Analytics</text>
  <text x="740" y="460" text-anchor="middle" font-size="10" fill="#86efac">density · OD patterns</text>
  <text x="740" y="473" text-anchor="middle" font-size="10" fill="#86efac">congestion · heatmaps</text>

  <line x1="860" y1="446" x2="890" y2="446" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="890" y="420" width="250" height="52" rx="10" fill="url(#cardGreen)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="1015" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Alert System</text>
  <text x="1015" y="460" text-anchor="middle" font-size="10" fill="#86efac">blacklist · route anomalies</text>
  <text x="1015" y="473" text-anchor="middle" font-size="10" fill="#86efac">real-time flagging</text>

  <!-- Arrow L3→L4 -->
  <line x1="600" y1="490" x2="600" y2="515" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowGreen)" filter="url(#glow)"/>

  <!-- ===== LAYER 4: PLATFORM ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="520" width="1120" height="120" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  </g>
  <rect x="40" y="520" width="6" height="120" rx="3" fill="#f59e0b"/>
  <text x="62" y="542" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="2">LAYER 4  ·  PLATFORM (web application)</text>
  <text x="62" y="557" font-size="10" fill="#64748b">FastAPI backend · React + Vite frontend · RBAC · audit log</text>

  <g filter="url(#shadow)">
    <rect x="70" y="570" width="220" height="52" rx="10" fill="url(#cardAmber)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="180" y="592" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">FastAPI Backend</text>
  <text x="180" y="610" text-anchor="middle" font-size="10" fill="#fde68a">REST + WebSocket · JWT/RBAC</text>

  <line x1="290" y1="596" x2="320" y2="596" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="320" y="570" width="250" height="52" rx="10" fill="url(#cardAmber)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="445" y="592" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">PostgreSQL / SQLite + Redis</text>
  <text x="445" y="610" text-anchor="middle" font-size="10" fill="#fde68a">observations · trajectories · alerts</text>

  <line x1="570" y1="596" x2="600" y2="596" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="600" y="570" width="270" height="52" rx="10" fill="url(#cardAmber)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="735" y="592" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">React + Vite Web UI</text>
  <text x="735" y="610" text-anchor="middle" font-size="10" fill="#fde68a">Dashboard · Vehicles · Trajectory · GIS</text>

  <g filter="url(#shadow)">
    <rect x="890" y="570" width="250" height="52" rx="10" fill="url(#cardAmber)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="1015" y="592" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Pages</text>
  <text x="1015" y="610" text-anchor="middle" font-size="10" fill="#fde68a">Analytics · Congestion · Alerts · Admin</text>

  <!-- Footer bar -->
  <rect x="40" y="660" width="1120" height="50" rx="10" fill="#0a0f1e" opacity="0.5"/>
  <text x="600" y="682" text-anchor="middle" font-size="11" fill="#94a3b8">data_source tagging (REAL_INFERENCE / DEMO_SYNTHETIC) · RBAC · audit log · 4-tier plate state (UNKNOWN / LOW_CONFIDENCE / TENTATIVE / VERIFIED)</text>
  <text x="600" y="700" text-anchor="middle" font-size="10" fill="#64748b">TrackX · NexussAI · SIH 2026 · SIH26127 · Bharat Electronics Limited · github.com/abinivesh-m/TrackX</text>

  <!-- Corner badge -->
  <rect x="1040" y="20" width="130" height="28" rx="14" fill="url(#accent)" opacity="0.9"/>
  <text x="1105" y="39" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">TRL 4–5</text>
</svg>