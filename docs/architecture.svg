<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.05">
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#fff"/>
    </pattern>
    <rect width="1280" height="760" fill="url(#dots)"/>
  </g>

  <!-- ===== HEADER ===== -->
  <rect x="0" y="0" width="1280" height="72" fill="#0a0f1e" opacity="0.7"/>
  <text x="640" y="36" text-anchor="middle" font-size="30" font-weight="800" fill="url(#titleGrad)">TrackX</text>
  <text x="640" y="56" text-anchor="middle" font-size="12" fill="#94a3b8" font-weight="500">City-Wide AI Engine for Multi-Camera ANPR Trajectory Tracking &amp; Urban Traffic Analytics</text>
  <text x="640" y="72" text-anchor="middle" font-size="9.5" fill="#64748b">SIH 2026  ·  SIH26127  ·  Bharat Electronics Limited  ·  Team NexussAI  ·  Sri Krishna College of Engineering and Technology</text>

  <!-- TRL badge -->
  <rect x="1130" y="18" width="120" height="26" rx="13" fill="url(#accentBar)" opacity="0.95"/>
  <text x="1190" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">TRL 4–5</text>

  <!-- ===== LAYER 1: INPUT ===== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="90" width="1200" height="88" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  </g>
  <rect x="40" y="90" width="5" height="88" rx="2.5" fill="#3b82f6"/>
  <text x="62" y="112" font-size="10.5" font-weight="700" fill="#60a5fa" letter-spacing="2.5">LAYER 1  ·  INPUT</text>
  <text x="62" y="126" font-size="9" fill="#64748b">Live &amp; recorded feeds</text>

  <g filter="url(#cardShadow)">
    <rect x="210" y="108" width="270" height="52" rx="10" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="240" y="130" font-size="12" font-weight="600" fill="#e2e8f0">📹 City CCTV / ANPR Cameras</text>
  <text x="240" y="148" font-size="9.5" fill="#93c5fd">RTSPS live streams (7 nodes)</text>

  <g filter="url(#cardShadow)">
    <rect x="510" y="108" width="220" height="52" rx="10" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="540" y="130" font-size="12" font-weight="600" fill="#e2e8f0">🎬 Recorded Video</text>
  <text x="540" y="148" font-size="9.5" fill="#93c5fd">MP4 / AVI footage</text>

  <g filter="url(#cardShadow)">
    <rect x="760" y="108" width="290" height="52" rx="10" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="790" y="130" font-size="12" font-weight="600" fill="#e2e8f0">⚙️ Stream Manager</text>
  <text x="790" y="148" font-size="9.5" fill="#93c5fd">FFmpeg bridge · frame extraction</text>

  <!-- Arrow L1→L2 -->
  <line x1="640" y1="180" x2="640" y2="208" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glow)"/>

  <!-- ===== LAYER 2: AI PIPELINE ===== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="212" width="1200" height="118" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  </g>
  <rect x="40" y="212" width="5" height="118" rx="2.5" fill="#8b5cf6"/>
  <text x="62" y="234" font-size="10.5" font-weight="700" fill="#a78bfa" letter-spacing="2.5">LAYER 2  ·  AI PIPELINE (per frame)</text>
  <text x="62" y="248" font-size="9" fill="#64748b">Detection → Plate detection → OCR → Appearance embedding</text>

  <g filter="url(#cardShadow)">
    <rect x="70" y="262" width="230" height="52" rx="10" fill="url(#purpleCard)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="100" y="284" font-size="12" font-weight="600" fill="#e2e8f0">YOLOv8 + ByteTrack</text>
  <text x="100" y="302" font-size="9.5" fill="#c4b5fd">Vehicle Detection &amp; Tracking</text>

  <line x1="300" y1="288" x2="330" y2="288" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="330" y="262" width="200" height="52" rx="10" fill="url(#purpleCard)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="360" y="284" font-size="12" font-weight="600" fill="#e2e8f0">Plate Detector</text>
  <text x="360" y="302" font-size="9.5" fill="#c4b5fd">YOLO (fine-tuned) / ONNX</text>

  <line x1="530" y1="288" x2="560" y2="288" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="560" y="262" width="270" height="52" rx="10" fill="url(#purpleCard)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="590" y="284" font-size="12" font-weight="600" fill="#e2e8f0">PaddleOCR + Temporal Fusion</text>
  <text x="590" y="302" font-size="9.5" fill="#c4b5fd">vote_plate_text() · confusable-char fix</text>

  <line x1="830" y1="288" x2="860" y2="288" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="860" y="262" width="260" height="52" rx="10" fill="url(#purpleCard)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="890" y="284" font-size="12" font-weight="600" fill="#e2e8f0">ResNet-18 Appearance</text>
  <text x="890" y="302" font-size="9.5" fill="#c4b5fd">Vehicle Re-ID (512-dim)</text>

  <!-- Arrow L2→L3 -->
  <line x1="640" y1="332" x2="640" y2="358" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glow)"/>

  <!-- ===== LAYER 3: INTELLIGENCE ===== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="362" width="1200" height="118" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  </g>
  <rect x="40" y="362" width="5" height="118" rx="2.5" fill="#22c55e"/>
  <text x="62" y="384" font-size="10.5" font-weight="700" fill="#4ade80" letter-spacing="2.5">LAYER 3  ·  INTELLIGENCE (multi-camera reasoning)</text>
  <text x="62" y="398" font-size="9" fill="#64748b">Identity fusion · trajectory reconstruction · analytics · alerts</text>

  <g filter="url(#cardShadow)">
    <rect x="70" y="410" width="250" height="62" rx="10" fill="url(#greenCard)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="100" y="431" font-size="12" font-weight="600" fill="#e2e8f0">Identity Fusion</text>
  <text x="100" y="449" font-size="9.5" fill="#86efac">plate 45% + appearance 25%</text>
  <text x="100" y="464" font-size="9.5" fill="#86efac">time 15% + space 15%</text>

  <line x1="320" y1="438" x2="350" y2="438" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>

  <g filter="url(#cardShadow)">
    <rect x="350" y="410" width="260" height="62" rx="10" fill="url(#greenCard)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="380" y="431" font-size="12" font-weight="600" fill="#e2e8f0">Trajectory Reconstruction</text>
  <text x="380" y="449" font-size="9.5" fill="#86efac">Coimbatore road graph</text>
  <text x="380" y="464" font-size="9.5" fill="#86efac">travel-time plausibility</text>

  <line x1="610" y1="438" x2="640" y2="438" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>

  <g filter="url(#cardShadow)">
    <rect x="640" y="410" width="250" height="62" rx="10" fill="url(#greenCard)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="670" y="431" font-size="12" font-weight="600" fill="#e2e8f0">Traffic Analytics</text>
  <text x="670" y="449" font-size="9.5" fill="#86efac">density · OD patterns</text>
  <text x="670" y="464" font-size="9.5" fill="#86efac">congestion · heatmaps</text>

  <line x1="890" y1="438" x2="920" y2="438" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>

  <g filter="url(#cardShadow)">
    <rect x="920" y="410" width="260" height="62" rx="10" fill="url(#greenCard)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="950" y="431" font-size="12" font-weight="600" fill="#e2e8f0">Alert System</text>
  <text x="950" y="449" font-size="9.5" fill="#86efac">blacklist · route anomalies</text>
  <text x="950" y="464" font-size="9.5" fill="#86efac">real-time flagging</text>

  <!-- Arrow L3→L4 -->
  <line x1="640" y1="480" x2="640" y2="506" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowG)" filter="url(#glow)"/>

  <!-- ===== LAYER 4: PLATFORM ===== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="510" width="1200" height="118" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  </g>
  <rect x="40" y="510" width="5" height="118" rx="2.5" fill="#f59e0b"/>
  <text x="62" y="532" font-size="10.5" font-weight="700" fill="#fbbf24" letter-spacing="2.5">LAYER 4  ·  PLATFORM (web application)</text>
  <text x="62" y="546" font-size="9" fill="#64748b">FastAPI backend · React + Vite frontend · RBAC · audit log</text>

  <g filter="url(#cardShadow)">
    <rect x="70" y="560" width="230" height="52" rx="10" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="100" y="582" font-size="12" font-weight="600" fill="#e2e8f0">FastAPI Backend</text>
  <text x="100" y="600" font-size="9.5" fill="#fde68a">REST + WebSocket · JWT/RBAC</text>

  <line x1="300" y1="586" x2="330" y2="586" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="330" y="560" width="260" height="52" rx="10" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="360" y="582" font-size="12" font-weight="600" fill="#e2e8f0">PostgreSQL / SQLite + Redis</text>
  <text x="360" y="600" font-size="9.5" fill="#fde68a">observations · trajectories · alerts</text>

  <line x1="590" y1="586" x2="620" y2="586" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="620" y="560" width="280" height="52" rx="10" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="650" y="582" font-size="12" font-weight="600" fill="#e2e8f0">React + Vite Web UI</text>
  <text x="650" y="600" font-size="9.5" fill="#fde68a">Dashboard · Vehicles · Trajectory · GIS</text>

  <g filter="url(#cardShadow)">
    <rect x="920" y="560" width="260" height="52" rx="10" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="950" y="582" font-size="12" font-weight="600" fill="#e2e8f0">Pages</text>
  <text x="950" y="600" font-size="9.5" fill="#fde68a">Analytics · Congestion · Alerts · Admin</text>

  <!-- Footer -->
  <rect x="40" y="650" width="1200" height="46" rx="10" fill="#0a0f1e" opacity="0.5"/>
  <text x="640" y="670" text-anchor="middle" font-size="10.5" fill="#94a3b8">data_source tagging (REAL_INFERENCE / DEMO_SYNTHETIC) · RBAC · audit log · 4-tier plate state (UNKNOWN / LOW_CONFIDENCE / TENTATIVE / VERIFIED)</text>
  <text x="640" y="688" text-anchor="middle" font-size="9.5" fill="#64748b">TrackX · NexussAI · SIH 2026 · SIH26127 · Bharat Electronics Limited · github.com/abinivesh-m/TrackX</text>

  <!-- Bottom corner -->
  <text x="640" y="745" text-anchor="middle" font-size="8.5" fill="#475569">Generated for the SIH 2026 grand finale</text>
</svg>