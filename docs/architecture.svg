<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">TrackX — System Architecture</text>
  <text x="550" y="66" text-anchor="middle" font-size="13" fill="#94a3b8">City-Wide AI Engine for Multi-Camera ANPR Trajectory Tracking &amp; Urban Traffic Analytics  ·  SIH26127 · BEL</text>

  <!-- Layer 1: Input -->
  <rect x="40" y="90" width="1020" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="112" font-size="12" font-weight="600" fill="#60a5fa" letter-spacing="1">LAYER 1 · INPUT</text>
  <rect x="80" y="125" width="260" height="40" rx="8" fill="url(#box)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="150" text-anchor="middle" font-size="13" fill="#e2e8f0">City CCTV / ANPR Cameras (RTSPS)</text>
  <rect x="420" y="125" width="200" height="40" rx="8" fill="url(#box)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="520" y="150" text-anchor="middle" font-size="13" fill="#e2e8f0">Recorded Video Files</text>
  <rect x="700" y="125" width="320" height="40" rx="8" fill="url(#box)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="860" y="150" text-anchor="middle" font-size="13" fill="#e2e8f0">Stream Manager (FFmpeg bridge)</text>

  <!-- Arrow down to layer 2 -->
  <line x1="550" y1="180" x2="550" y2="205" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: AI Pipeline -->
  <rect x="40" y="210" width="1020" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="232" font-size="12" font-weight="600" fill="#60a5fa" letter-spacing="1">LAYER 2 · AI PIPELINE (per frame)</text>
  <rect x="60" y="248" width="230" height="52" rx="8" fill="url(#box)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="175" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">YOLOv8 + ByteTrack</text>
  <text x="175" y="288" text-anchor="middle" font-size="10" fill="#94a3b8">Vehicle Detection &amp; Tracking</text>
  <line x1="290" y1="274" x2="315" y2="274" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="315" y="248" width="200" height="52" rx="8" fill="url(#box)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="415" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Plate Detector</text>
  <text x="415" y="288" text-anchor="middle" font-size="10" fill="#94a3b8">YOLO (fine-tuned) / ONNX</text>
  <line x1="515" y1="274" x2="540" y2="274" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="248" width="230" height="52" rx="8" fill="url(#box)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="655" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">PaddleOCR + Temporal Fusion</text>
  <text x="655" y="288" text-anchor="middle" font-size="10" fill="#94a3b8">vote_plate_text() · confusable-char fix</text>
  <line x1="770" y1="274" x2="795" y2="274" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="795" y="248" width="245" height="52" rx="8" fill="url(#box)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="917" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">ResNet-18 Appearance</text>
  <text x="917" y="288" text-anchor="middle" font-size="10" fill="#94a3b8">Vehicle Re-ID embedding (512-dim)</text>

  <!-- Arrow down to layer 3 -->
  <line x1="550" y1="320" x2="550" y2="345" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Intelligence -->
  <rect x="40" y="350" width="1020" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="372" font-size="12" font-weight="600" fill="#60a5fa" letter-spacing="1">LAYER 3 · INTELLIGENCE (multi-camera reasoning)</text>
  <rect x="60" y="388" width="230" height="52" rx="8" fill="url(#box)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="175" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Identity Fusion</text>
  <text x="175" y="428" text-anchor="middle" font-size="10" fill="#94a3b8">plate 45% + appearance 25% + time 15% + space 15%</text>
  <line x1="290" y1="414" x2="315" y2="414" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="315" y="388" width="230" height="52" rx="8" fill="url(#box)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Trajectory Reconstruction</text>
  <text x="430" y="428" text-anchor="middle" font-size="10" fill="#94a3b8">Coimbatore road graph · travel-time plausibility</text>
  <line x1="545" y1="414" x2="570" y2="414" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="388" width="230" height="52" rx="8" fill="url(#box)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="685" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Traffic Analytics</text>
  <text x="685" y="428" text-anchor="middle" font-size="10" fill="#94a3b8">density · OD patterns · congestion · heatmaps</text>
  <line x1="800" y1="414" x2="825" y2="414" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="825" y="388" width="235" height="52" rx="8" fill="url(#box)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="942" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Alert System</text>
  <text x="942" y="428" text-anchor="middle" font-size="10" fill="#94a3b8">blacklist · route anomalies · real time</text>

  <!-- Arrow down to layer 4 -->
  <line x1="550" y1="460" x2="550" y2="485" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Platform -->
  <rect x="40" y="490" width="1020" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="512" font-size="12" font-weight="600" fill="#60a5fa" letter-spacing="1">LAYER 4 · PLATFORM (web app)</text>
  <rect x="60" y="528" width="200" height="52" rx="8" fill="url(#box)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="550" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">FastAPI Backend</text>
  <text x="160" y="568" text-anchor="middle" font-size="10" fill="#94a3b8">REST + WebSocket · JWT/RBAC</text>
  <line x1="260" y1="554" x2="285" y2="554" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="285" y="528" width="230" height="52" rx="8" fill="url(#box)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="550" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">PostgreSQL / SQLite + Redis</text>
  <text x="400" y="568" text-anchor="middle" font-size="10" fill="#94a3b8">observations · trajectories · alerts</text>
  <line x1="515" y1="554" x2="540" y2="554" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="528" width="260" height="52" rx="8" fill="url(#box)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="670" y="550" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">React + Vite Web UI</text>
  <text x="670" y="568" text-anchor="middle" font-size="10" fill="#94a3b8">Dashboard · Vehicles · Trajectory · GIS</text>
  <rect x="820" y="528" width="240" height="52" rx="8" fill="url(#box)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="940" y="550" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Pages</text>
  <text x="940" y="568" text-anchor="middle" font-size="10" fill="#94a3b8">Analytics · Congestion · Alerts · Admin</text>

  <!-- Footer -->
  <text x="550" y="635" text-anchor="middle" font-size="11" fill="#64748b">data_source tagging (REAL_INFERENCE / DEMO_SYNTHETIC) · RBAC · audit log · 4-tier plate state (UNKNOWN / LOW_CONFIDENCE / TENTATIVE / VERIFIED)</text>
  <text x="550" y="655" text-anchor="middle" font-size="11" fill="#64748b">TrackX · NexussAI · SIH 2026 · Problem Statement SIH26127 · Bharat Electronics Limited</text>
  <text x="550" y="700" text-anchor="middle" font-size="9" fill="#475569">Generated for the SIH 2026 grand finale · github.com/abinivesh-m/TrackX</text>
</svg>