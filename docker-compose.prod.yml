version: '3.8'

services:
  # PostgreSQL (production database)
  postgres:
    image: postgres:15-alpine
    container_name: trackx-postgres
    environment:
      POSTGRES_USER: trackx
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trackx123}
      POSTGRES_DB: trackx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trackx
    restart: unless-stopped

  # Redis (caching)
  redis:
    image: redis:7-alpine
    container_name: trackx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trackx
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackx-backend
    environment:
      DATABASE_URL: postgresql://trackx:${DB_PASSWORD:-trackx123}@postgres:5432/trackx
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "False"
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - trackx
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trackx-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - trackx
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  trackx:
    driver: bridge
